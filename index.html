<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Multiplier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 400px;
        }
        .input-group, .button-group {
            margin-bottom: 20px;
        }
        button[data-tag="ar"] {
            background-color: #FF9900; /* Orange */
        }
        button[data-tag="mr"] {
            background-color: #48D1CC; /* cyan */
        }
        button[data-tag="smg"] {
            background-color: #FF0000; /* red */
        }
        button[data-tag="sg"] {
            background-color: #100000; /* black */
            color: #FFFFFF;
        }
        button[data-tag="ex"] {
            background-color: #008000; /* olive */
        }
        button[data-tag="las"] {
            background-color: #FFFF00; /* yellow */
        }
        button[data-tag="sp"] {
            background-color: #0000FF; /* blue */
        }
        label[data-tag="indent"] {
            display: inline-block; /* Allows margins/padding to work correctly */
            padding-left: 50px;    /* Indents the text from the left */
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        button {
            padding: 10px 15px;
            margin-right: 5px;
            margin-bottom: 5px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            border-radius: 4px;
        }
        button:hover {
            background-color: #e0e0e0;
            text-color: #000000;
        }
        input {
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }
        #result-box {
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 5px solid #007BFF;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h2>Calculator</h2>

    <!-- Step 2: Multiplier Buttons -->
    <div class="button-group">
        <label>Primary Weapon:</label>
            <div>
        <label style ="color: #FF9900"; data-tag="indent">Assault Rifles</label><br>
        <button data-tag="ar" onclick="calculate(990)">liberator</button>
        <button data-tag="ar" onclick="calculate(990)">STA-52 AR</button>
        <button data-tag="ar" onclick="calculate(715)">liberator penetrator</button>
        <button data-tag="ar" onclick="calculate(855)">adjudicator</button>
        <button data-tag="ar" onclick="calculate(900)">MA-5C AR</button>
        <button data-tag="ar" onclick="calculate(525)">Liberator concussive</button>
        <button data-tag="ar" onclick="calculate(1120)">supressor</button>
        <button data-tag="ar" onclick="calculate(605)">pacifier</button>
        <button data-tag="ar" onclick="calculate(1260)">tenderizer</button>
        <button data-tag="ar" onclick="calculate(1350)">liberator carbine</button>
        <button data-tag="ar" onclick="calculate(750)">coyote</button>
        <button data-tag="ar" onclick="calculate(990)">AR/GL-21 One-Two(b) </button>
        <button data-tag="ar" onclick="calculate(950)">AR/GL-21 One-Two(e) </button>
            </div>
            <div>
        <label style="color: #48D1CC"; data-tag="indent">Marksman Rifles</label><br>
        <button data-tag="mr" onclick="calculate(990)">Dilligence</button>
        <button data-tag="mr" onclick="calculate(990)">R-2124 Constitution</button>
        <button data-tag="mr" onclick="calculate(990)">R-2 Amendment</button>
        <button data-tag="mr" onclick="calculate(990)">R-72 Censor</button>
        <button data-tag="mr" onclick="calculate(990)">R-63CS Diligence Counter Sniper</button>
        <button data-tag="mr" onclick="calculate(990)">R-6 Deadeye</button>
            </div>
            <div>
        <label  style="color: #FF0000"; data-tag="indent">Submachine Guns</label><br>
        <button data-tag="smg" onclick="calculate(990)">Defender</button>
            </div>
            <div>
        <label  style="color: #100000"; data-tag="indent">Shotguns</label><br>
        <button data-tag="sg" onclick="calculate(810)">Punisher</button>
            </div>
            <div>
        <label  style="color: #008000"; data-tag="indent">Explosive</label><br>
            </div>
            <div>
        <label  style="color: #FFFF00"; data-tag="indent">Energy-Based</label><br>
        <button data-tag="las" onclick="calculate(750)">Sickle</button>
            </div>
            <div>
        <label  style="color: ##0000FF"; data-tag="indent">Special</label><br>
            </div>
    </div>
    
        <!-- Step 1: User Input -->
    <div class="input-group">
        <label for="numInput">Enter a number:</label>
        <input type="number" id="numInput" value="20" placeholder="Type a number...">
    </div>

    <!-- Step 3: Display Result -->
    <div id="result-box">
        Result: <strong id="resultValue">0</strong>
    </div>

    <script>
        function calculate(multiplier) {
            // Get the input value
            const inputValue = document.getElementById('numInput').value;
            
            // Validate that the input is a valid number
            if (inputValue === "") {
                alert("Please enter a valid number first.");
                return;
            }

            // Perform the logic: (Input / 20) * Multiplier
            const stepOne = Number(inputValue) / 20;
            const finalResult = stepOne * multiplier;

            // Display the result on the webpage
            document.getElementById('resultValue').innerText = finalResult;
        }
    </script>

</body>
</html>
