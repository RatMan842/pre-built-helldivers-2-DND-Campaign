<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Multiplier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 400px;
        }
        .input-group, .button-group, .ammo-group {
            margin-bottom: 20px;
        }
        button[data-tag="ar"] {
            background-color: #FF9900; /* Orange */
        }
        button[data-tag="mr"] {
            background-color: #48D1CC; /* cyan */
        }
        button[data-tag="smg"] {
            background-color: #FF0000; /* red */
        }
        button[data-tag="sg"] {
            background-color: #100000; /* black */
            color: #FFFFFF;
        }
        button[data-tag="ex"] {
            background-color: #008000; /* olive */
        }
        button[data-tag="las"] {
            background-color: #FFFF00; /* yellow */
        }
        button[data-tag="sp"] {
            background-color: #0000FF; /* blue */
        }
        label[data-tag="indent"] {
            display: inline-block; /* Allows margins/padding to work correctly */
            padding-left: 50px;    /* Indents the text from the left */
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        button {
            padding: 8px 13px;
            margin-right: 5px;
            margin-bottom: 5px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            border-radius: 4px;
        }
        button:hover {
            background-color: #e0e0e0;
            text-color: #000000;
        }
        input {
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }
        #result-box {
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 5px solid #007BFF;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h2>Calculator</h2>

    <!-- Step 2: Multiplier Buttons -->
    <div class="button-group">
        <label>Primary Weapon:</label>
            <div>
        <label style ="color: #FF9900"; data-tag="indent">Assault Rifles</label><br>
        <button data-tag="ar" onclick="calculate(90), updateAmmo('11')">liberator</button>
        <button data-tag="ar" onclick="calculate(90), updateAmmo('11')">STA-52 AR</button>
        <button data-tag="ar" onclick="calculate(65), updateAmmo('11')">liberator penetrator</button>
        <button data-tag="ar" onclick="calculate(95), updateAmmo('9')">adjudicator</button>
        <button data-tag="ar" onclick="calculate(90), updateAmmo('10')">MA-5C AR</button>
        <button data-tag="ar" onclick="calculate(75), updateAmmo('7')">Liberator concussive</button>
        <button data-tag="ar" onclick="calculate(80), updateAmmo('14')">supressor</button>
        <button data-tag="ar" onclick="calculate(55), updateAmmo('11')">pacifier</button>
        <button data-tag="ar" onclick="calculate(105), updateAmmo('13')">tenderizer(f)</button>
        <button data-tag="ar" onclick="calculate(105), updateAmmo('10')">tenderizer(s)</button>
        <button data-tag="ar" onclick="calculate(90), updateAmmo('15')">liberator carbine</button>
        <button data-tag="ar" onclick="calculate(75), updateAmmo('10')">coyote</button>
        <button data-tag="ar" onclick="calculate(95), updateAmmo('10')">AR/GL-21 One-Two(b) </button>
        <button data-tag="ar" onclick="calculate(650), updateAmmo('1')">AR/GL-21 One-Two(e) </button>
            </div>
            <div>
        <label style="color: #48D1CC"; data-tag="indent">Marksman Rifles</label><br>
        <button data-tag="mr" onclick="calculate(165), updateAmmo('6')">Dilligence</button>
        <button data-tag="mr" onclick="calculate(180), updateAmmo('1')">R-2124 Constitution</button>
        <button data-tag="mr" onclick="calculate(200), updateAmmo('8')">R-2 Amendment</button>
        <button data-tag="mr" onclick="calculate(165), updateAmmo('7')">R-72 Censor</button>
        <button data-tag="mr" onclick="calculate(200), updateAmmo('6')">R-63CS Diligence Counter Sniper</button>
        <button data-tag="mr" onclick="calculate(300), updateAmmo('2')">R-6 Deadeye</button>
            </div>
            <div>
        <label  style="color: #FF0000"; data-tag="indent">Submachine Guns</label><br>
        <button data-tag="smg" onclick="calculate(110), updateAmmo('9')">Defender</button>
            </div>
            <div>
        <label  style="color: #100000"; data-tag="indent">Shotguns</label><br>
        <button data-tag="sg" onclick="calculate(405), updateAmmo('2')">Punisher</button>
            </div>
            <div>
        <label  style="color: #008000"; data-tag="indent">Explosive</label><br>
            </div>
            <div>
        <label  style="color: #FFFF00"; data-tag="indent">Energy-Based</label><br>
        <button data-tag="las" onclick="calculate(60), updateAmmo('12')">Sickle</button>
            </div>
            <div>
        <label  style="color: #0000FF"; data-tag="indent">Special</label><br>
            </div>
    </div>

    <div class="ammo-group">
        <label for="ammoInput">Enter a number from 1 to <span id="output"></span>:</label>
        <input type="number" id="ammoInput" value="1" placeholder="Type a number...">
    </div>
    
        <!-- Step 1: User Input -->
    <div class="input-group">
        <label for="numInput">Enter a number:</label>
        <input type="number" id="numInput" value="20" placeholder="Type a number...">
    </div>
    
    <!-- Step 3: Display Result -->
    <div id="result-box">
        Result: <strong id="resultValue">0</strong>
    </div>

    <script>
        let ammo = "11";
        function updateAmmo(newValue) {
          ammo = newValue;// Assigns the new value to the let variable
          console.log(ammo); // Checks the value in the console
          // Updates the HTML to show the current variable value
          document.getElementById("output").innerText = ammo;
        }
        function calculate(multiplier) {
            // Get the input value
            const inputValue = document.getElementById('numInput').value;
            const inputAmmoShot = document.getElementById('ammoInput').value;
            
            // Validate that the input is a valid number
            if (inputValue === "" || inputValue > "20" || inputValue < "1") {
                alert("Please enter a valid number first.");
                return;
            }
            if (inputAmmoShot === "" || inputAmmoShot > ammo || inputAmmoShot < "1") {
                alert("Please enter a valid number first.");
                return;
            }

            // Perform the logic: (Input / 20) * Multiplier
            const stepOne = number(inputAmmoShot) * multiplier;
            const stepTwo = Number(inputValue) / 20;
            const finalResult = stepOne * stepTwo;

            // Display the result on the webpage
            document.getElementById('resultValue').innerText = finalResult;
        }
    </script>

</body>
</html>
