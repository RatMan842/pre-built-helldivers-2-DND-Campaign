<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Button Calculator</title>
</head>
<body>

  <!-- Display Box -->
  <input type="text" id="display" disabled>

  <!-- Buttons -->
  <div>
    <button onclick="appendValue('5')">Add 5</button>
    <button onclick="applyFormula('double')">Double It</button>
    <button onclick="clearDisplay()">Clear</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
