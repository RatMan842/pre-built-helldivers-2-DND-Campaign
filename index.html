<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .calculator {
            max-width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        label, input, button {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        input {
            padding: 8px;
        }
        button {
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            font-weight: bold;
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h3>Calculator</h3>
    
    <label for="baseNumber">Base Number:</label>
    <input type="number" id="baseNumber" value="10">

    <label for="multiplierInput">Input Multiplier:</label>
    <input type="number" id="multiplierInput" value="5">

    <button onclick="calculate()">Multiply by (Input / 20)</button>

    <div class="result">Result: <span id="output">0</span></div>
</div>

<script>
function calculate() {
    // 1. Get the values from the input fields
    const base = parseFloat(document.getElementById('baseNumber').value);
    const inputVal = parseFloat(document.getElementById('multiplierInput').value);

    // 2. Check if the inputs are valid numbers
    if (isNaN(base) || !isNaN(inputVal) === false) {
        document.getElementById('output').innerText = "Please enter valid numbers";
        return;
    }

    // 3. Perform the math logic: Base * (Input / 20)
    const result = base * (inputVal / 20);

    // 4. Display the result, rounding to 4 decimal places if necessary
    document.getElementById('output').innerText = Number(result.toFixed(4));
}
</script>

</body>
</html>
