<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Multiplier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 400px;
        }
        .container {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .btn-group {
            margin: 15px 0;
        }
        button {
            padding: 10px 15px;
            margin-right: 5px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #007BFF;
            background-color: white;
            color: #007BFF;
            border-radius: 4px;
        }
        button:hover {
            background-color: #007BFF;
            color: white;
        }
        input {
            padding: 8px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Multiplier Calculator</h3>
    
    <!-- Step 1: User enters the input value -->
    <label for="numberInput">Enter a number:</label>
    <input type="number" id="numberInput" value="100" placeholder="Type a number...">

    <!-- Step 2: User clicks a button to pick a multiplier -->
    <p>Pick a multiplier button:</p>
    <div class="btn-group">
        <button onclick="calculate(990)">liberator</button>
        <button onclick="calculate(990)">STA-52 AR</button>
        <button onclick="calculate(990)">Defender</button>
        <button onclick="calculate(990)">Dilligence</button>
        <button onclick="calculate(810)">Punisher</button>
        <button onclick="calculate(750)">Sickle</button>
    </div>

    <!-- Step 3: The result is displayed here -->
    <div class="result" id="output">Result: 0</div>
</div>

<script>
function calculate(buttonValue) {
    // 1. Get the current value from the input field
    const inputValue = parseFloat(document.getElementById('numberInput').value);

    // 2. Validate that the input is a valid number
    if (isNaN(inputValue)) {
        document.getElementById('output').innerText = "Please enter a valid number first.";
        return;
    }

    // 3. Perform the math logic: buttonValue * (inputValue / 20)
    const finalResult = buttonValue * (inputValue / 20);

    // 4. Display the result on the page, rounding to 2 decimal places if needed
    document.getElementById('output').innerText = `Result: ${finalResult}`;
}
</script>

</body>
</html>
