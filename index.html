<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Multiplier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 400px;
        }
        .input-group, .button-group {
            margin-bottom: 20px;
        }
        button[data-tag="ar"] {
            background-color: #E34F26; /* Orange */
        }
        button[data-tag="mr"] {
            background-color: #48D1CC; /* cyan */
        }
        button[data-tag="smg"] {
            background-color: #FF0000; /* cyan */
        }
        button[data-tag="sg"] {
            background-color: #100000; /* cyan */
            color: #FFFFFF;
        }
        button[data-tag="ex"] {
            background-color: #008000; /* black */
        }
        button[data-tag="las"] {
            background-color: #FFFF00; /* cyan */
        }
        button[data-tag="sp"] {
            background-color: #0000FF; /* cyan */
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        button {
            padding: 10px 15px;
            margin-right: 5px;
            margin-bottom: 5px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            border-radius: 4px;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        input {
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }
        #result-box {
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 5px solid #007BFF;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h2>Calculator</h2>

    <!-- Step 2: Multiplier Buttons -->
    <div class="button-group">
        <label>Primary Weapon:</label>
        <button data-tag="ar" onclick="calculate(990)">liberator</button>
        <button data-tag="ar" onclick="calculate(990)">STA-52 AR</button>
        <button data-tag="ar" onclick="calculate(990)">liberator penetrator</button>
        <button data-tag="ar" onclick="calculate(990)">adjudicator</button>
        <button data-tag="ar" onclick="calculate(990)">MA-5C AR</button>
        <button data-tag="ar" onclick="calculate(990)">Liberator concussive</button>
        <button data-tag="ar" onclick="calculate(990)">supressor</button>
        <button data-tag="ar" onclick="calculate(990)">pacifier</button>
        <button data-tag="ar" onclick="calculate(990)">tenderizer</button>
        <button data-tag="ar" onclick="calculate(990)">liberator carbine</button>
        <button data-tag="ar" onclick="calculate(990)">coyote</button>
        <button data-tag="ar" onclick="calculate(990)">AR/GL-21 One-Two </button>
        <button data-tag="smg" onclick="calculate(990)">Defender</button>
        <button data-tag="mr" onclick="calculate(990)">Dilligence</button>
        <button data-tag="sg" onclick="calculate(810)">Punisher</button>
        <button data-tag="las" onclick="calculate(750)">Sickle</button>
    </div>
    
        <!-- Step 1: User Input -->
    <div class="input-group">
        <label for="numInput">Enter a number:</label>
        <input type="number" id="numInput" value="100" placeholder="Type a number...">
    </div>

    <!-- Step 3: Display Result -->
    <div id="result-box">
        Result: <strong id="resultValue">0</strong>
    </div>

    <script>
        function calculate(multiplier) {
            // Get the input value
            const inputValue = document.getElementById('numInput').value;
            
            // Validate that the input is a valid number
            if (inputValue === "") {
                alert("Please enter a valid number first.");
                return;
            }

            // Perform the logic: (Input / 20) * Multiplier
            const stepOne = Number(inputValue) / 20;
            const finalResult = stepOne * multiplier;

            // Display the result on the webpage
            document.getElementById('resultValue').innerText = finalResult;
        }
    </script>

</body>
</html>
